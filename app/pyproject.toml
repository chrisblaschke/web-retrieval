[project]
name = "web-retrieval"
version = "0.1.0"
description = "Self-hosted web search and retrieval for coding agents"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
  "ddgs==9.16.0",
  "scrapling==0.4.15",
  "trafilatura==2.3.1",
  "curl-cffi==0.16.3",
  "httpx==0.28.1",
  "fastapi==0.143.2",
  "uvicorn[standard]==0.54.0",
  "fastmcp==4.1.0",
  "pypdfium2==5.14.0",
  "html-to-markdown==3.18.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
