# Purpose: local web-retrieval stack; project: web-retrieval.
# Stop with docker compose down; add --volumes to discard the cache.
# Container logs use the bounded json-file driver below.

name: ${COMPOSE_PROJECT_NAME:-web-retrieval}

x-defaults: &defaults
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

networks:
  edge: {}
  jail:
    internal: true
    # No host address on this bridge: the app cannot reach host services.
    driver_opts: { com.docker.network.bridge.inhibit_ipv4: "true" }
    ipam:
      config: [{ subnet: "${JAIL_SUBNET:-172.30.245.0/24}" }]

volumes:
  data: {}

services:
  gate:
    <<: *defaults
    image: alpine/socat:1.8.1.3@sha256:466c8a0383e16463fabdb7df01008292fb78d07da60224a46cb5d3142ce122ed
    command: ["-d", "TCP-LISTEN:8000,fork,reuseaddr", "TCP:app:8000"]
    cap_drop: [ALL]
    read_only: true
    networks: [edge, jail]
    ports: ["127.0.0.1:${HTTP_PORT:-8890}:8000"]
    depends_on: [app]
    mem_limit: 128m

  app:
    <<: *defaults
    build: ./app
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    networks: [jail]
    volumes: ["data:/data"]
    env_file: .env
    environment:
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      CRAWL4AI_URL: ${CRAWL4AI_URL:-}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      EGRESS_PROXY: ${EGRESS_PROXY:-http://smokescreen:4750}
      DATA_DIR: /data
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web-retrieval}
    depends_on: [smokescreen, searxng]
    mem_limit: 2g

  smokescreen:
    <<: *defaults
    build: ./smokescreen
    command:
      - --listen-ip=0.0.0.0
      - --listen-port=4750
      - --timeout=15s
      - --deny-range=::ffff:6440:0/106  # CGNAT, in IPv4-mapped IPv6 notation
      - --deny-range=198.18.0.0/15    # benchmarking range
      - --deny-range=192.0.0.0/24
      - --deny-range=fc00::/7        # all IPv6 unique-local space
      - --deny-range=64:ff9b::/96     # NAT64 can map back to private IPv4
    cap_drop: [ALL]
    read_only: true
    networks: [edge, jail]
    mem_limit: 256m

  dns:
    <<: *defaults
    profiles: [render]
    image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    command: ["-conf", "/Corefile"]
    # The coredns binary carries a file capability for port 53, which no-new-privileges blocks.
    security_opt: []
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    volumes: ["./coredns/Corefile:/Corefile:ro"]
    networks:
      edge: {}
      jail: { ipv4_address: "${JAIL_DNS_IP:-172.30.245.53}" }
    mem_limit: 128m

  searxng:
    <<: *defaults
    image: searxng/searxng:2026.11.2-cccbc9e15@sha256:892ed5710603e38f9dc201e6a0b2f3f14dbdb8108edcadac30e55b165c979fb7
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set in .env}
    volumes: ["./searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    networks: [edge, jail]
    ports: ["127.0.0.1:${SEARXNG_PORT:-8888}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 1g

  crawl4ai:
    <<: *defaults
    profiles: [render]
    image: unclecode/crawl4ai:0.9.5@sha256:0b05666882bfb67f45d559a5b827839c54127b74aedd723f8ab338a3571b5fc9
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      CRAWL4AI_UPSTREAM_PROXY: http://smokescreen:4750
      NO_PROXY: localhost,127.0.0.1
    dns: ["${JAIL_DNS_IP:-172.30.245.53}"]
    depends_on: [dns, smokescreen]
    networks: [jail]
    shm_size: 1g
    mem_limit: 4g
